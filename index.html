<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virtueller Rundgang – St. Remigius Diedesfeld</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
#panorama{position:fixed;inset:0;background:#111}
#portal{
  position:fixed;inset:0;z-index:100;background:#111;
  display:flex;align-items:center;justify-content:center
}
#portal img{width:100%;height:100%;object-fit:contain}
#enter{
  position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);
  border:0;border-radius:999px;padding:14px 22px;
  background:rgba(0,0,0,.76);color:white;font-size:17px;font-weight:700;
  cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.4)
}
#enter:hover{transform:translate(-50%,-50%) scale(1.05)}

#tourMenu{
  position:fixed;left:16px;top:50%;transform:translateY(-50%);
  z-index:90;width:190px;padding:10px;border-radius:14px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  box-shadow:0 6px 24px rgba(0,0,0,.35);
  display:none;
}
#tourMenu .title{
  color:white;font-weight:700;font-size:14px;padding:5px 7px 8px
}
#tourMenu button{
  width:100%;display:block;margin:5px 0;padding:10px 11px;
  border:0;border-radius:9px;background:rgba(255,255,255,.94);
  color:#222;font-size:13px;font-weight:600;text-align:left;cursor:pointer
}
#tourMenu button:hover{background:white}

#topbar{
  position:fixed;left:12px;right:12px;top:12px;z-index:80;
  display:none;justify-content:flex-end;pointer-events:none
}
#topbar button{
  pointer-events:auto;border:0;border-radius:9px;padding:8px 11px;
  background:rgba(0,0,0,.60);color:white;cursor:pointer
}
@media(max-width:700px){
  #tourMenu{
    left:8px;top:auto;bottom:8px;transform:none;width:168px;
    max-height:56vh;overflow:auto
  }
  #tourMenu button{padding:8px 9px;font-size:12px}
}
</style>
</head>
<body>

<div id="panorama"></div>

<div id="tourMenu">
  <div class="title">Rundgang</div>
  <button onclick="goScene('kirchenschiff')">Kirchenschiff</button>
  <button onclick="goScene('chorraum')">Chorraum</button>
  <button onclick="goScene('chorraum2')">Hochaltar</button>
  <button onclick="goScene('empore')">Empore</button>
  <button onclick="goScene('remigiusplatz')">Remigiusplatz</button>
  <button onclick="showPortal()">Kirchenportal</button>
</div>

<div id="topbar">
  <button onclick="showPortal()">⌂ Portal</button>
</div>

<div id="portal">
  <img src="Portal.jpg" alt="Kirchenportal St. Remigius Diedesfeld">
  <button id="enter" onclick="enterChurch()">👣 Kirche betreten</button>
</div>

<script>
const viewer = pannellum.viewer('panorama', {
  default: {
    firstScene: 'kirchenschiff',
    autoLoad: true,
    sceneFadeDuration: 450,
    showControls: true,
    compass: false
  },
  scenes: {
    kirchenschiff: {
      title: 'Kirchenschiff',
      type: 'multires',
      multiRes: {
        basePath: 'tiles/kirchenschiff',
        path: '/%l/%s%y_%x',
        fallbackPath: '/fallback/%s',
        extension: 'jpg',
        tileResolution: 512,
        maxLevel: 4,
        cubeResolution: 3784
      },
      yaw: 180, pitch: 0, hfov: 92
    },

    chorraum: {
      title: 'Chorraum',
      type: 'multires',
      multiRes: {
        basePath: 'tiles/chorraum',
        path: '/%l/%s%y_%x',
        fallbackPath: '/fallback/%s',
        extension: 'jpg',
        tileResolution: 512,
        maxLevel: 4,
        cubeResolution: 3784
      },
      yaw: 180, pitch: 0, hfov: 90
    },

    chorraum2: {
      title: 'Chorraum · Hochaltar',
      type: 'multires',
      multiRes: {
        basePath: 'tiles/chorraum2',
        path: '/%l/%s%y_%x',
        fallbackPath: '/fallback/%s',
        extension: 'jpg',
        tileResolution: 512,
        maxLevel: 4,
        cubeResolution: 3784
      },
      yaw: 180, pitch: 0, hfov: 86
    },

    empore: {
      title: 'Empore',
      type: 'equirectangular',
      panorama: 'Empore.jpg',
      yaw: 0, pitch: 0, hfov: 82
    },

    remigiusplatz: {
      title: 'Remigiusplatz',
      type: 'equirectangular',
      panorama: 'Remigiusplatz.jpg',
      yaw: 0, pitch: 0, hfov: 82
    }
  }
});

const startView={
  kirchenschiff:{pitch:0,yaw:180,hfov:92},
  chorraum:{pitch:0,yaw:180,hfov:90},
  chorraum2:{pitch:0,yaw:180,hfov:86},
  empore:{pitch:0,yaw:0,hfov:82},
  remigiusplatz:{pitch:0,yaw:0,hfov:82}
};

function goScene(id){
  document.getElementById('portal').style.display='none';
  document.getElementById('tourMenu').style.display='block';
  document.getElementById('topbar').style.display='flex';
  const v=startView[id];
  viewer.loadScene(id,v.pitch,v.yaw,v.hfov);
}

function enterChurch(){
  goScene('kirchenschiff');
}

function showPortal(){
  document.getElementById('portal').style.display='flex';
  document.getElementById('tourMenu').style.display='none';
  document.getElementById('topbar').style.display='none';
}
</script>

</body>
</html>
